name: Validate agents and MCP server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Frontmatter, unique names, runbook rosters, and catalog.json vs disk
      - name: Validate agents, runbooks, and catalog
        run: npm run validate

      # README tables must match what `npm run docs` generates from catalog.json
      - name: Check generated README tables
        run: npm run docs:check

      - name: Build
        run: npm run build

      # Starts the stdio server and checks every agent is listed and returns a prompt
      - name: Smoke test MCP server
        run: npm run smoke
