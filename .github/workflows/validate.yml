name: Validate agents and MCP server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The installer runs on macOS bash 3.2, which reads a non-ASCII byte right
      # after "$VAR" (e.g. "$URL…") as part of the name and fails under `set -u`.
      # CI's bash 5 doesn't, so check for the pattern instead. Use "${VAR}…".
      - name: Check installer script
        working-directory: .
        run: |
          bash -n scripts/install-skills.sh
          if LC_ALL=C grep -nE '\$[A-Za-z_][A-Za-z0-9_]*[^ -~]' scripts/install-skills.sh; then
            echo "::error file=scripts/install-skills.sh::Brace variables followed by non-ASCII characters, e.g. \${VAR}…"
            exit 1
          fi

      # Frontmatter, unique names, runbook rosters, and catalog.json vs disk
      - name: Validate agents, runbooks, and catalog
        run: npm run validate

      # README tables must match what `npm run docs` generates from catalog.json
      - name: Check generated README tables
        run: npm run docs:check

      - name: Build
        run: npm run build

      # Starts the stdio server and checks every agent is listed and returns a prompt
      - name: Smoke test MCP server
        run: npm run smoke
