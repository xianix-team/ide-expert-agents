name: Publish MCP server to npm

on:
  push:
    branches: [main]
    paths:
      - "mcp-server/**"
      - "*-agents-store/**" # agent stores are bundled into the package at build time
      - ".github/workflows/publish-npm.yml"
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11 — trusted publishing needs npm >= 11.5.1
          node-version: 24
          registry-url: https://registry.npmjs.org
          # no dependency cache: npm advises against caching in release builds

      - name: Show npm version
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm — bump the version in mcp-server/package.json to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $NAME@$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via npm trusted publishing (GitHub OIDC) — no NPM_TOKEN.
      # Provenance is generated automatically for trusted publishes.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
